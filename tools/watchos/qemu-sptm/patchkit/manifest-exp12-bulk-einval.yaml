# EXPERIMENT #12: bulk-flip every `MOV Wd, #22` inside
# shared_region_map_and_slide_setup (sub_FFFFFFF009F79CA8, 0x27A0 bytes)
# to `MOV Wd, #0`. There are 30 such sites — the function's return value
# register (W25) is loaded with EINVAL from each of the 11 Hex-Rays-level
# rejection branches; those collapse to many more asm sites because the
# compiler duplicated the setup across cleanup paths. Flipping them all
# forces every rejection path to return KERN_SUCCESS instead.
#
# This is empirical: a single boot tells us whether downstream code can
# tolerate a "success" where the mapping is in fact only partially set up.
# If the kernel panics on dereferencing an unset mapping, we know which
# invariant was load-bearing and can disable only that one.

va_base:       0xFFFFFFF007E2C000
file_text_off: 0xE28000

patches:
  - name: einval-to-zero-site-01-W25
    va:    0xFFFFFFF009F7A0D8
    orig:  "d9028052"
    new:   "19008052"
