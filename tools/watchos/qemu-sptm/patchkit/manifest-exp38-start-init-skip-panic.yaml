# EXPERIMENT #38: redirect start_init's "exec failed" panic to the
# function's success return path.
#
# exp37 proved the launchd Mach-O validator rejects /sbin/launchd
# itself (not a child process). The kernel's start_init at
# sub_FFFFFFF009EB0D4C sees exec_mach_imgact return non-zero and
# panics "Process 1 exec of /sbin/launchd failed, errno 85 @kern_exec.c:9098"
# via BL sub_FFFFFFF00A1C0498 at 0xFFFFFFF009EB0F70.
#
# Replace that BL with a backward `B 0xFFFFFFF009EB0F38` (start of
# the function's epilogue: LDP X29,X30 ... RETAB). This makes
# start_init return normally even when exec failed.
#
# Risk: init process has no user code loaded. Scheduler will try
# to schedule it and either loop in kernel idle, or crash. But
# serial output should keep flowing from OTHER kernel threads.
#
# Apply ON TOP of bootkc.exp37 (exp16 + exp37 error-return).

va_base:       0xFFFFFFF007E2C000
file_text_off: 0xE28000

patches:
  - name: exp38-start-init-skip-panic
    effect: >
      replace `BL sub_FFFFFFF00A1C0498` at 0xFFFFFFF009EB0F70
      (the "Process 1 exec of /sbin/launchd failed" panic emission)
      with `B 0xFFFFFFF009EB0F38` to redirect into the function's
      normal epilogue.
    va:    0xFFFFFFF009EB0F70
    orig:  "4a3d0c94"
    new:   "f2ffff17"

scanners: []
